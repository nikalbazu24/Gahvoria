<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gahvoria · Biblioteca y opciones</title>
<style>
@font-face{font-family:Montserrat;src:url('../app/src/main/res/font/montserrat_regular.ttf')}@font-face{font-family:Montserrat;src:url('../app/src/main/res/font/montserrat_bold.ttf');font-weight:700}
:root{color-scheme:dark;--bg:#141519;--panel:#202125;--line:#34353c;--ink:#f5f3f3;--muted:#a9abb5;--accent:#ff8b7c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Montserrat,system-ui,sans-serif}button{font:inherit;cursor:pointer;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:16px;min-height:48px;padding:12px 16px}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button.active{background:#373035;color:var(--accent);border-color:#80524d}button:disabled{opacity:.5;cursor:default}header{display:flex;align-items:center;gap:12px;max-width:780px;margin:auto;padding:20px 22px}header b{font-size:20px}header small{display:block;font-size:10px;letter-spacing:1.5px;color:var(--muted);margin-top:3px}header .count{margin-left:auto;color:var(--muted);font-size:12px}main{max-width:600px;margin:auto;padding:0 20px 110px}.cover{height:224px;width:168px;margin:4px auto 22px;background:linear-gradient(145deg,#3e3b4d 10%,#644a59 55%,#252d3b);border:1px solid #55505d;border-radius:22px;display:flex;flex-direction:column;justify-content:space-between;padding:18px;box-shadow:0 10px 22px #0003;overflow:hidden;position:relative}.cover:before{content:'';position:absolute;width:200px;height:200px;background:#ff8b7c22;transform:rotate(40deg);left:60px;top:50px}.cover span{font-size:9px;letter-spacing:1px;color:#e9e0e0}.cover b{font-size:20px;z-index:1}.dots{text-align:center;color:var(--accent);letter-spacing:4px;margin:-12px 0 18px}h1{font-size:25px;line-height:1.3;letter-spacing:-.6px;margin:0 0 7px}h2{font-size:22px;margin:0}p{line-height:1.6}.muted,.meta{color:var(--muted);font-size:12px;line-height:1.5}.meta{margin-bottom:18px}.ok{color:#9fcdaf}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;margin:16px 0;overflow:hidden}.card .content{padding:16px}.eyebrow{color:var(--accent);font-size:10px;letter-spacing:1.5px;font-weight:700;margin-bottom:5px}.actions{display:flex;gap:10px}.actions>*{flex:1}.primary{background:linear-gradient(110deg,#ff8b7c,#f5aa8b);border:0;color:#291b1b;font-weight:700}.full{width:100%}.row{display:flex;width:100%;align-items:center;gap:14px;padding:17px;text-align:left;border:0;border-radius:0;background:none}.row+.row{border-top:1px solid var(--line)}.row>span:first-child{flex:1}.row strong{font-size:14px;display:block;margin-bottom:5px}.row small{display:block;color:var(--muted);line-height:1.5;font-size:12px}.chevron{color:var(--accent);font-size:22px}.switch{width:44px;min-width:44px;height:27px;display:block;border-radius:20px;background:var(--accent);padding:3px}.switch:after{content:'';display:block;width:21px;height:21px;background:white;border-radius:50%;margin-left:17px}.switch.off{background:#555760}.switch.off:after{margin:0}.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin;margin-top:18px}.tabs button{white-space:nowrap;min-height:46px;font-size:12px;padding:10px 14px}.titlebar{display:flex;align-items:center;gap:12px;margin-top:8px}.titlebar h1{font-size:21px;margin:0}.back{font-size:24px;min-width:44px;padding:5px}.heading{font-size:11px;letter-spacing:1.5px;color:var(--muted);margin-top:24px}.radio{width:20px;height:20px;border-radius:50%;border:2px solid #777}.radio.on{border:6px solid var(--accent)}nav{display:flex;gap:4px;padding:6px;border:1px solid var(--line);border-radius:24px;background:#202125f5;position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:580px;backdrop-filter:blur(12px)}nav button{flex:1;min-width:0;padding:9px 2px;border:0;background:none;font-size:9px;border-radius:18px}nav button span{display:block;font-size:19px;margin-bottom:5px}.hidden{display:none!important}#toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);width:max-content;max-width:90%;padding:14px 18px;background:#373039;border:1px solid #80524d;border-radius:16px;font-size:12px;z-index:2}.demo{font-size:10px;color:var(--muted);text-align:center;margin:20px 0 0}@media(min-width:760px){main{max-width:780px}#library{display:grid;grid-template-columns:260px 1fr;gap:34px;align-items:center;min-height:440px}.cover{width:216px;height:288px;margin-top:30px}.cover b{font-size:24px}#options{max-width:560px;margin:auto}nav{bottom:20px}}
</style>
<header><svg width="29" height="36" viewBox="0 0 80 100" aria-hidden="true"><path fill="#ff9a88" d="M20 4h40l16 16v73H4V20Z"/><rect x="13" y="20" width="54" height="38" rx="5" fill="#141519"/><path fill="#ff9a88" d="m40 25 12 14-12 15-12-15Z"/><path stroke="#141519" stroke-width="5" d="M22 73v14m12-14v14m12-14v14m12-14v14"/></svg><div><b>Gahvoria</b><small>TU BIBLIOTECA</small></div><span class="count">1 juego</span></header>
<main><section id="library"><div><div class="cover"><span>RPG MAKER XP</span><b>Pokémon<br>Reborn</b></div><div class="dots">━━</div></div><div><h1>Pokémon Reborn</h1><div class="meta">RPG Maker XP &nbsp;·&nbsp; <span class="ok">Compatible</span></div><div class="card"><div class="content"><div class="eyebrow">TU PARTIDA</div>Continúa tu aventura.<div class="muted" style="margin-top:5px">Partidas y tiempo: datos de ejemplo</div></div></div><button class="primary full" onclick="toast('Vista previa: aquí se abrirá el juego.')">▶ &nbsp; Jugar</button><div class="actions" style="margin-top:10px"><button onclick="openOptions(0)">Traducción</button><button onclick="openOptions(-1)">Opciones</button></div></div></section>
<section id="settings" class="hidden"></section><section id="options" class="hidden"><div class="titlebar"><button class="back" onclick="home()" aria-label="Volver a la biblioteca">‹</button><h1>Pokémon Reborn</h1></div><div class="tabs" role="tablist" aria-label="Opciones del juego"></div><div id="panel" role="tabpanel"></div></section><p class="demo">Propuesta interactiva · No ejecuta juegos ni cambia tus archivos.</p></main>
<nav aria-label="Navegación principal"><button class="active" onclick="home()"><span>▤</span>Biblioteca</button><button onclick="toast('Añadir: carpeta de juego o archivo ZIP.')"><span>＋</span>Añadir</button><button onclick="toast('Tienda: catálogo de juegos y sus creadores.')"><span>▱</span>Tienda</button><button onclick="toast('Actualizaciones de Gahvoria.')"><span>↻</span>Actualizar</button><button onclick="settings()"><span>⚙</span>Ajustes</button></nav><div id="toast" class="hidden" role="status"></div>
<script>
const names=['Traducción','Pantalla','Controles','Partidas','Avanzado'];let enabled=true,screen=0,touch=true,retro=false,timer;
function row(title,detail,end='',action=''){return `<${action?'button':'div'} class="row" ${action?`onclick="${action}"`:''}><span><strong>${title}</strong><small>${detail}</small></span>${end}</${action?'button':'div'}>`}
function toggle(on){return `<span class="switch ${on?'':'off'}" aria-hidden="true"></span>`}
function openOptions(i){document.querySelector('#settings').classList.add('hidden');document.querySelector('#library').classList.add('hidden');document.querySelector('#options').classList.remove('hidden');document.querySelector('.tabs').innerHTML='';document.querySelector('.titlebar button').onclick=()=>i<0?home():openOptions(-1);document.querySelector('#panel').innerHTML=i<0?'<p class="muted">Opciones de este juego</p>'+names.map((n,j)=>'<div class="card">'+row(n,['Idioma, preparación y resultados','Formato de imagen y efecto retro','Botones táctiles y distribución','Guardados, respaldos e importación','Motor, informes y administración'][j],'<span class="chevron">›</span>',`openOptions(${j})`)+'</div>').join(''):'<div class="heading">'+names[i]+' · ESTE JUEGO</div>'+panel(i);}
const sections=[['Traducción','Idioma y traductor'],['Apariencia','Tema, colores e icono'],['Carátulas','Imágenes de tu biblioteca'],['Archivos y accesos','Permisos y otros launchers'],['Informes','Diagnóstico y ayuda'],['Creadores','Herramientas para desarrollar juegos'],['Acerca de','Versión y licencias']];
function settings(i=-1){document.querySelector('#library').classList.add('hidden');document.querySelector('#options').classList.add('hidden');const el=document.querySelector('#settings');el.classList.remove('hidden');el.innerHTML='<div class="titlebar"><button class="back" aria-label="Volver" onclick="'+(i<0?'home()':'settings()')+'">‹</button><h1>'+ (i<0?'Ajustes':sections[i][0])+'</h1></div>'+(i<0?'<p class="muted">Personaliza Gahvoria. Las opciones de cada juego están en tu biblioteca.</p><input aria-label="Buscar ajustes" placeholder="Buscar en ajustes" oninput="filterSettings(this.value)" style="width:100%;padding:16px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;font:inherit"><div id="settings-list"></div>':'<div class="heading">AJUSTES GENERALES</div>'+(i===0?'<div class="card">'+row('Traducir mientras juegas','Elige después qué juegos traducir.',toggle(enabled),'enabled=!enabled;settings(0)')+'</div><div class="heading">TRADUCTOR</div><div class="card">'+row('Gahvoria Neural AI','Inglés → español sin conexión.','<span class="radio on"></span>')+row('En el teléfono','Paquete de idioma de Google.')+row('DeepL','Con tu propia clave.')+'</div><div class="heading">IDIOMA</div><div class="card">'+row('Español','Idioma seleccionado.')+'</div>':'<div class="card">'+row(sections[i][0],sections[i][1])+row('Opciones conservadas','Esta vista representa la nueva organización; los controles reales siguen en la app.')+'</div>'));if(i<0)filterSettings('');}
function filterSettings(query){const groups=[['TU EXPERIENCIA',[0,1]],['BIBLIOTECA',[2,3]],['AYUDA Y AVANZADO',[4,5,6]]];const n=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let content='';groups.forEach(([title,indices])=>{const found=indices.filter(i=>n(sections[i].join(' ')).includes(n(query)));if(found.length)content+='<div class="heading">'+title+'</div><div class="card">'+found.map(i=>row(sections[i][0],sections[i][1],'<span class="chevron">›</span>',`settings(${i})`)).join('')+'</div>'});document.querySelector('#settings-list').innerHTML=content||'<p class="muted">No hay coincidencias.</p>';}

function panel(i){if(i===0)return `<div class="card">${row('Traducción al español','Conserva tus traducciones para la próxima partida.',toggle(enabled),'enabled=!enabled;openOptions(0)')}</div><div class="heading">ANTES DE JUGAR</div><div class="card">${row('Preparar traducción','Revisa los textos del juego y prepara su traducción.','<span class="chevron">›</span>',"toast('Aquí podrás preparar, pausar o reanudar la traducción.')")}</div><div class="heading">REVISAR RESULTADOS</div><div class="card">${row('Cobertura del catálogo','Frases revisadas y pendientes. No mide la calidad del español.','<span class="chevron">›</span>',"toast('Vista previa: no hay datos reales de cobertura.')")}${row('Traducción en partida','Consulta los textos registrados durante una sesión.','<span class="chevron">›</span>',"toast('Informe de la última sesión de prueba.')")}</div><p class="muted">El texto integrado en imágenes requiere un tratamiento aparte.</p>`;
if(i===1)return `<div class="heading">FORMATO DE PANTALLA</div><div class="card">${['Original (4:3)','Panorámica solo en el mapa','Panorámica completa · Experimental'].map((n,j)=>row(n,['Conserva la proporción del juego.','Amplía el mapa; menús y batallas conservan su formato.','Puede producir errores visuales en menús y batallas.'][j],`<span class="radio ${screen===j?'on':''}"></span>`,`screen=${j};openOptions(1)`)).join('')}</div><div class="card">${row('Pantalla retro','Líneas suaves sobre la imagen.',toggle(retro),'retro=!retro;openOptions(1)')}</div><p class="muted">Los cambios se aplican al volver a abrir el juego.</p>`;
if(i===2)return `<div class="card">${row('Controles táctiles','Se ocultan al conectar un mando.',toggle(touch),'touch=!touch;openOptions(2)')}</div><div class="card">${row('Distribución de botones','El editor actual conserva el tamaño y la posición que elijas.','<span class="chevron">›</span>',"toast('El editor de botones sigue disponible dentro de la app.')")}</div>`;
if(i===3)return `<div class="card">${row('Tus partidas','Lista de guardados del juego.')}</div><div class="card">${row('Guardar respaldo','Exporta tus partidas en un ZIP.','›',"toast('Vista previa: no se exporta ningún archivo.')")}${row('Importar un respaldo','Solicita confirmación antes de reemplazar.','›',"toast('Vista previa: no se modifica ningún guardado.')")}${row('Importar de otro emulador','Selecciona su carpeta de partidas.','›',"toast('Vista previa: no se modifica ningún guardado.')")}</div>`;
return `<div class="heading">COMPATIBILIDAD</div><div class="card">${row('Motor automático','Elige el motor según el juego.','<span class="radio on"></span>')}${row('Última carga e informes','Tiempos y errores del juego.','›',"toast('Conserva el informe técnico para diagnosticar fallos.')")}</div><div class="heading">ADMINISTRAR JUEGO</div><div class="card">${row('Carátula','Imagen y atribución.')}${row('Quitar de la biblioteca','Conserva el juego y sus partidas.','›',"toast('Vista previa: no se elimina ningún juego.')")}</div>`;}
function home(){document.querySelector('#settings').classList.add('hidden');document.querySelector('#library').classList.remove('hidden');document.querySelector('#options').classList.add('hidden')}
function toast(text){let n=document.querySelector('#toast');n.textContent=text;n.classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>n.classList.add('hidden'),3200)}
</script></html>
