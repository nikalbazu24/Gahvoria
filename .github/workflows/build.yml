# Compila Gahvoria (APK Android de 64 bits) y publica cada rama en su canal de Releases.

name: Compilar APK

on:
  push:
    branches: [main, experimental/neural-ai-phase-1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GAHVORIA_BUILD_NUMBER: ${{ github.run_number }}
  GAHVORIA_DEV_TAG: ${{ (github.ref == 'refs/heads/experimental/neural-ai-phase-1' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'experimental/neural-ai-phase-1')) && 'neural-beta' || 'dev' }}
  GAHVORIA_REPORT_TOKEN: ${{ secrets.GAHVORIA_REPORT_TOKEN }}
  NDK_VERSION: 25.2.9519653
  BERGAMOT_NDK_VERSION: 29.0.14206865
  ABI: arm64-v8a
  HOST: aarch64-linux-android
  TARGET: aarch64-linux-android
  API: 21

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Ruby del sistema (necesario para compilar el Ruby de Android)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Revisar los scripts de compatibilidad del motor
        run: find engine/src/main/assets/essentia_preload -name '*.rb' -exec ruby -c {} \;

      - name: Instalar herramientas de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool bison gperf pkg-config wget xxd ninja-build

      - name: Instalar Android NDK
        timeout-minutes: 12
        run: |
          ndk_compiler="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          for attempt in 1 2; do
            if [ -x "$ndk_compiler" ]; then break; fi
            echo "Preparando Android NDK (intento $attempt de 2)"
            if yes | timeout 300 "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"; then break; fi
          done
          test -x "$ndk_compiler"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      # Las librerías nativas tardan mucho la primera vez; después se recuperan de la caché.
      - name: Recuperar librerías compiladas antes
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            engine/jni/build-arm64-v8a
            engine/jni/libiconv
            engine/jni/libogg
            engine/jni/libtheora
            engine/jni/libvorbis
            engine/jni/openal
            engine/jni/openssl
            engine/jni/physfs
            engine/jni/pixman
            engine/jni/ruby
            engine/jni/SDL2
            engine/jni/SDL2_image
            engine/jni/SDL2_sound
            engine/jni/SDL2_ttf
            engine/jni/uchardet
          key: deps-${{ env.ABI }}-ndk${{ env.NDK_VERSION }}-${{ hashFiles('engine/jni/get_deps.sh', 'engine/jni/Makefile') }}

      - name: Descargar dependencias del motor
        working-directory: engine/jni
        run: ./get_deps.sh

      - name: Compilar dependencias nativas (iconv, OpenAL, OpenSSL, Ruby)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: engine/jni
        run: ARCH=linux-x86_64 make -j"$(nproc)"

      - name: Empaquetar la configuración del Ruby de Android
        run: |
          shopt -s nullglob
          prefix="engine/jni/build-$ABI"
          files=("$prefix"/lib/ruby/3.1.0/*/rbconfig.rb)
          test "${#files[@]}" -eq 1
          ruby -c "${files[0]}"
          relative="${files[0]#"$prefix"/}"
          install -D -m 644 "${files[0]}" "engine/src/main/assets/ruby-runtime/$relative"

      - name: Incrustar ícono, fuentes y shaders en el motor
        working-directory: engine/jni/mkxp-z
        run: sh ./make_xxd.sh

      # Motor clásico (Ruby 1.8.7) para juegos antiguos. Ambos motores son obligatorios.
      - name: Recuperar Ruby 1.8 compilado antes
        id: ruby18-cache
        uses: actions/cache@v4
        with:
          path: engine/jni/ruby18-out
          key: ruby18-${{ env.ABI }}-ndk${{ env.NDK_VERSION }}-${{ hashFiles('engine/jni/build_ruby18.sh') }}

      - name: Compilar Ruby 1.8 (motor clásico)
        if: steps.ruby18-cache.outputs.cache-hit != 'true'
        working-directory: engine/jni
        run: ./build_ruby18.sh

      - name: Recuperar el motor Neural compilado
        id: bergamot-cache
        uses: actions/cache@v4
        with:
          path: engine/src/main/jniLibs/arm64-v8a/libgahvoria_bergamot.so
          key: bergamot-arm64-r29-${{ hashFiles('engine/neural/build.sh', 'engine/neural/CMakeLists.txt', 'engine/neural/bergamot_jni.cpp', 'engine/neural/jni.map') }}

      - name: Compilar Bergamot para Android ARM64
        if: steps.bergamot-cache.outputs.cache-hit != 'true'
        timeout-minutes: 55
        run: |
          ndk="$ANDROID_HOME/ndk/$BERGAMOT_NDK_VERSION"
          if [ ! -f "$ndk/source.properties" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$BERGAMOT_NDK_VERSION"
          fi
          test "$(sed -n 's/^Pkg.Revision = //p' "$ndk/source.properties")" = "$BERGAMOT_NDK_VERSION"
          ANDROID_NDK="$ndk" bash engine/neural/build.sh

      - name: Preparar el modelo Neural verificado
        timeout-minutes: 12
        run: python3 engine/neural/fetch_model.py

      - name: Preparar la firma de Gahvoria
        env:
          KS_B64: ${{ secrets.GAHVORIA_KEYSTORE_B64 }}
          KS_PASSWORD: ${{ secrets.GAHVORIA_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASSWORD" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/gahvoria.jks"
            echo "GAHVORIA_KEYSTORE_FILE=$RUNNER_TEMP/gahvoria.jks" >> "$GITHUB_ENV"
            echo "GAHVORIA_KEYSTORE_PASSWORD=$KS_PASSWORD" >> "$GITHUB_ENV"
            echo "GAHVORIA_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "GAHVORIA_SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::Sin los secretos GAHVORIA_KEYSTORE_*: el APK usa una firma de prueba."
          fi

      - name: Pruebas y APK
        run: |
          if ./gradlew --no-daemon :app:testReleaseUnitTest assembleRelease > "$RUNNER_TEMP/gradle.log" 2>&1; then
            tail -5 "$RUNNER_TEMP/gradle.log"
          else
            grep -n -E "^e: |error:|undefined reference|FAILED|What went wrong|Test.*FAILED" -A3 "$RUNNER_TEMP/gradle.log" | head -150 || true
            tail -40 "$RUNNER_TEMP/gradle.log"
            exit 1
          fi

      - name: Comprobar el APK
        run: |
          cp app/build/outputs/apk/release/*.apk gahvoria.apk
          python3 tools/release_manifest.py app/build/outputs/apk/release/output-metadata.json version.json
          cat version.json
          python3 tools/verify_apk.py gahvoria.apk version.json
          python3 engine/neural/verify_package.py gahvoria.apk
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && { [ "$GITHUB_REF" = "refs/heads/main" ] || [ "$GAHVORIA_DEV_TAG" = "neural-beta" ]; } && [ "$GAHVORIA_SIGNED" != "true" ]; then
            echo "::error::La distribución requiere la firma fija de Gahvoria."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose gahvoria.apk

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: gahvoria-apk
          path: |
            gahvoria.apk
            version.json

      - name: Publicar en Releases (versión dev, canal del actualizador)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Gahvoria (versión de desarrollo)
          prerelease: true
          make_latest: false
          body: |
            Compilación automática del último cambio (${{ github.sha }}).
            Descarga gahvoria.apk e instálala en tu Android de 64 bits.
            Gahvoria avisa sola cuando hay una versión nueva.
          files: |
            gahvoria.apk
            version.json

      - name: Publicar en Releases (canal Neural Beta)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/experimental/neural-ai-phase-1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neural-beta
          target_commitish: ${{ github.sha }}
          name: Gahvoria Neural AI (beta experimental)
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Compilación experimental (${{ github.sha }}). Las instalaciones de esta beta pueden recibir nuevas betas desde Actualizaciones → Todas las versiones.
          files: |
            gahvoria.apk
            version.json
